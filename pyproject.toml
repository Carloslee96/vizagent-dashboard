[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizagent-dashboard"
version = "0.1.0"
description = "Turn business requirements into HTML dashboards — use your own AI. BYO API key or use spec mode with zero API calls."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "VizAgent Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/vizagent/dashboard"
Source = "https://github.com/vizagent/dashboard"

[project.scripts]
vizagent = "vizagent_dashboard.cli:main"

[tool.hatch.build]
include = ["src/vizagent_dashboard/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
