[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizagent-dashboard"
version = "0.1.7"
description = "Compile CSV/XLSX data and DashboardSpec into validated offline HTML dashboards."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "VizAgent Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
all = [
    "playwright>=1.45.0",
]

[project.urls]
Homepage = "https://github.com/Carloslee96/vizagent-dashboard"
Source = "https://github.com/Carloslee96/vizagent-dashboard"

[project.scripts]
vizagent = "vizagent_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vizagent_dashboard"]
# 把各 AI 工具的 Skill 规则文件打进 wheel，供 `vizagent skill install` 读取
force-include = {".claude/skills/vizagent-dashboard/SKILL.md" = "vizagent_dashboard/skill_assets/SKILL.md", ".cursor/rules/vizagent-dashboard.mdc" = "vizagent_dashboard/skill_assets/cursor-vizagent-dashboard.mdc", ".codex/prompts/vizagent-dashboard.md" = "vizagent_dashboard/skill_assets/codex-vizagent-dashboard.md"}

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
    "/.claude/skills/vizagent-dashboard/SKILL.md",
    "/.cursor/rules/vizagent-dashboard.mdc",
    "/.codex/prompts/vizagent-dashboard.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
