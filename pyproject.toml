[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizagent-dashboard"
version = "0.1.0"
description = "Compile CSV/XLSX data and DashboardSpec into validated offline HTML dashboards."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "VizAgent Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
all = [
    "playwright>=1.45.0",
]

[project.urls]
Homepage = "https://github.com/vizagent/dashboard"
Source = "https://github.com/vizagent/dashboard"

[project.scripts]
vizagent = "vizagent_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vizagent_dashboard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
