<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商销售数据大屏</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://registry.npmmirror.com https://cdn.bootcdn.net https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <style>
:root {
  --bg-primary: #111217;
  --bg-deeper: #0b0c0f;
  --bg-card: #181b1f;
  --bg-elevated: #1f2329;
  --bg-hover: #262b33;
  --border-subtle: #2a2f37;
  --accent-primary: #5794F2;
  --accent-success: #73BF69;
  --accent-warning: #FF9830;
  --accent-danger: #F2495C;
  --text-primary: #d8d9da;
  --text-secondary: #9fa4ad;
  --map-area: #1f2329;
  --map-boundary: #9fa4ad;
  --text-muted: #6e7280;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Inter, sans-serif;
  background-color: #111217;
  color: #d8d9da;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 24px;
}

.dashboard-container {
  max-width: 1920px;
  margin: 0 auto;
}

.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid #2a2f37;
}

.dashboard-title {
  font-family: Inter, sans-serif;
  font-size: 26px;
  font-weight: 600;
  color: #d8d9da;
}

.dashboard-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
}

.panel {
  background-color: #181b1f;
  border: 1px solid #2a2f37;
  border-radius: 16px;
  padding: 20px 24px;
}

.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: #d8d9da;
  margin-bottom: 12px;
}

.kpi-card {
  background-color: #181b1f;
  border: 1px solid #2a2f37;
  border-radius: 16px;
  padding: 20px 24px;
  text-align: left;
}

.kpi-label {
  font-size: 13px;
  color: #9fa4ad;
  margin-bottom: 8px;
}

.kpi-value {
  font-family: Inter, sans-serif;
  font-size: 32px;
  font-weight: 600;
  color: #d8d9da;
}

.chart-container {
  width: 100%;
  height: 320px;
}

.text-secondary {
  color: #9fa4ad;
}

.accent {
  color: #5794F2;
}
</style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1 class="dashboard-title">电商销售数据大屏</h1>
      <span class="text-secondary">vizagent-dashboard</span>
    </div>

    <div class="dashboard-grid">

        <div class="kpi-card">
          <div class="kpi-label">总销售额</div>
          <div class="kpi-value">¥5,465,000</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-label">总利润</div>
          <div class="kpi-value">¥1,300,800</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-label">总销量</div>
          <div class="kpi-value">100,360</div>
        </div>
    </div>

    <div class="dashboard-grid" style="margin-top: 16px;">

        <div class="panel">
          <div class="panel-title">月销售额趋势</div>
          <div id="chart-panel-0" class="chart-container"></div>
        </div>

        <div class="panel">
          <div class="panel-title">各品类销售额占比</div>
          <div id="chart-panel-1" class="chart-container"></div>
        </div>

        <div class="panel">
          <div class="panel-title">各地区销售额对比</div>
          <div id="chart-panel-2" class="chart-container"></div>
        </div>

        <div class="panel">
          <div class="panel-title">利润 vs 数量</div>
          <div id="chart-panel-3" class="chart-container"></div>
        </div>
    </div>
  </div>
