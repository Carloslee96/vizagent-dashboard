name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES_v0.1.5.md
      # ── PyPI 发布（Trusted Publisher，OIDC 免 token）────────────
      # 依赖 maintainer 在 pypi.org 预登记 pending publisher：
      #   project=vizagent-dashboard, owner=Carloslee96,
      #   repo=vizagent-dashboard, workflow=release.yml
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
