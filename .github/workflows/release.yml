name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES_v0.1.0.md
      # ── PyPI 发布（v0.1.0 暂停）─────────────────────────────────
      # 首次发布到 PyPI 需先在 https://pypi.org 注册项目并把 GitHub 配为
      # Trusted Publisher（一次性，需 maintainer 账号）。完成后再取消下方注释。
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
